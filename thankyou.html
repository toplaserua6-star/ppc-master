<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Спасибо за заявку! | ppcmaster.vercel.app</title>
    <link rel="shortcut icon" href="https://static.tildacdn.pro/tild3461-3666-4737-a236-653830363266/favicon.ico" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --secondary-bg: #1c1c1c;
            --primary-color: #ed3f41;
            --text-color: #ffffff;
            --text-secondary: #9c9c9c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: var(--secondary-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary-color), transparent, var(--primary-color));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.2;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px rgba(237, 63, 65, 0.4);
        }

        .icon-box svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        p {
            font-size: 18px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 18px 40px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            border-radius: 3000px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(237, 63, 65, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #de3032;
            box-shadow: 0 15px 30px rgba(237, 63, 65, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 30px 20px;
            }
            h1 { font-size: 28px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
        </div>
        <h1>Заявка принята!</h1>
        <p>Спасибо за ваше доверие. Я уже получил ваше сообщение и свяжусь с вами в ближайшее время (обычно это занимает не более 10-15 минут).</p>
        <a href="/" class="btn">Вернуться на сайт</a>
    </div>
</body>
</html>
